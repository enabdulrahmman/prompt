<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموسوعة العالمية للبرومبتات | Global Prompt Encyclopedia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #05070a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            background: radial-gradient(circle at top, #1a2a6c, #b21f1f, #fdbb2d); /* خلفية ديناميكية */
            background-attachment: fixed;
            color: var(--text);
            font-family: 'Cairo', 'Poppins', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        /* الهيدر الاحترافي */
        header {
            text-align: center;
            padding: 60px 0;
            backdrop-filter: blur(10px);
            background: var(--glass);
            border-radius: 0 0 50px 50px;
            margin-bottom: 40px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 { font-size: 3rem; margin: 0; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .live-counter { color: #00ff88; font-weight: bold; font-size: 1.2rem; margin-top: 10px; }

        /* شريط البحث العالمي */
        .search-box {
            position: sticky;
            top: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid var(--primary);
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.2rem;
            outline: none;
            text-align: center;
        }

        /* كروت البرومبتات */
        .prompt-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            transition: 0.4s;
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0,210,255,0.3);
        }

        .tag-lang { position: absolute; top: 10px; left: 10px; background: var(--primary); font-size: 10px; padding: 2px 8px; border-radius: 5px; }

        h3 { color: var(--primary); margin-top: 10px; }

        .prompt-text {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            direction: ltr;
            border-left: 4px solid var(--primary);
            margin: 15px 0;
            font-size: 0.95rem;
        }

        .copy-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        footer { text-align: center; padding: 50px; font-size: 0.9rem; border-top: 1px solid var(--glass); }

        /* التجاوب مع الجوال */
        @media (max-width: 600px) { h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Global Prompt Encyclopedia</h1>
            <p>الموسوعة الأضخم عالمياً - تحديثات يومية فورية</p>
            <div class="live-counter">🟢 عدد البرومبتات الحالية: 10,000,000+</div>
            <p style="font-size: 0.8rem;">بواسطة: المهندس عبد الرحمن الريمي</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="search()" placeholder="ابحث في 10 مليون برومبت بالعربية أو الإنجليزية...">
        </div>

        <div class="prompt-grid" id="container">
            </div>

        <footer>
            <p>© 2024 موسوعة الريمي العالمية | <a href="https://t.me/toe_Ai" style="color:var(--primary)">انضم لقناتنا للتحديثات اليومية</a></p>
        </footer>
    </div>

    <script>
        // مصفوفة البرومبتات (يفضل وضعها في ملف JSON خارجي كما شرحت لك سابقاً)
        const prompts = [
            { title: "ملخص يوتيوب احترافي", lang: "AR/EN", text: "Summarize this video. Extract main points and actionable data.", cat: "Content" },
            { title: "تحليل ثغرات الأندرويد", lang: "Cyber", text: "Analyze this code for vulnerabilities as a security researcher.", cat: "Security" },
            { title: "خطة مبيعات 10M", lang: "Business", text: "Create a sales strategy to reach 10 million dollars in revenue.", cat: "Business" }
            // هنا تضاف الملايين عبر ملف JSON
        ];

        function display(items) {
            const root = document.getElementById('container');
            root.innerHTML = items.map((p, index) => `
                <div class="card">
                    <span class="tag-lang">${p.lang}</span>
                    <h3>${p.title}</h3>
                    <div class="prompt-text" id="t-${index}">${p.text}</div>
                    <button class="copy-btn" onclick="copy('t-${index}')">نسخ البرومبت | Copy</button>
                </div>
            `).join('');
        }

        function copy(id) {
            const t = document.getElementById(id).innerText;
            navigator.clipboard.writeText(t);
            alert("تم النسخ بنجاح! | Copied Successfully ✅");
        }

        function search() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtered = prompts.filter(p => p.title.toLowerCase().includes(val) || p.text.toLowerCase().includes(val));
            display(filtered);
        }

        display(prompts);
    </script>
</body>
</html>
